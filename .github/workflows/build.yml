name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Folder Structure
        run: |
          echo "=== Root Files ==="
          ls -la
          echo "=== Finding pubspec.yaml ==="
          find . -name "pubspec.yaml"
